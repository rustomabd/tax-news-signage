name: build-feed
on:
  push:
    paths: ["tax.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 merge_feed.py
      - run: |
          git config user.name "rasd-bot"
          git config user.email "rasd-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "RASD: build feed.json" && git pull --rebase && git push)

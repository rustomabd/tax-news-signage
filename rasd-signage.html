<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>راصد الأخبار الضريبية — شاشة العرض</title>
<style>
@font-face { font-family:'Lusail'; src:url('Lusail__Regular.otf') format('opentype'); font-weight:400; }
@font-face { font-family:'Lusail'; src:url('Lusail__Bold.otf') format('opentype'); font-weight:700; }
@font-face { font-family:'Lusail'; src:url('Lusail__Black.otf') format('opentype'); font-weight:900; }

:root{
  --u:1vh;   /* وحدة القياس: أفقي = ارتفاع الشاشة · طولي = عرضها */
  --crimson:#BA1538;
  --crimson-dark:#7a0e24;
  --gold:#A29475;
  --gold-light:#c4b89a;
  --gold-dark:#8a7550;
  --navy:#0D4261;
  --teal:#009C80;
  --cream:#f7f5f1;
  --white:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;font-variant-numeric:lining-nums;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Lusail',sans-serif;
  background:
    radial-gradient(circle at 85% 12%, rgba(162,148,117,0.16), transparent 45%),
    linear-gradient(135deg,#06496b 0%, #04344c 55%, #021e2c 100%);
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100vh;
  width:100vw;
}

/* ============ الهيدر ============ */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:5px solid #fff;
  background:#032a3d;   /* أغمق قليلاً من الخلفية · بدون تدرّج ذهبي */
  flex-shrink:0;
  padding:0 3vw;
}
.brand-title{
  display:flex;flex-direction:column;justify-content:center;
  padding:calc(4 * var(--u)) 0;   /* ارتفاع ومساحات سلبية */
}
.brand-title h1{font-size:calc(4.8 * var(--u));font-weight:900;line-height:1.1;letter-spacing:0.05vw;}
.brand-sub{font-size:calc(2 * var(--u));color:var(--gold-light);font-weight:400;margin-top:calc(0.8 * var(--u));}
/* الشعار: يظهر في الشاشة الطولية فقط */
.brand-wrap{display:flex;align-items:center;gap:calc(2.4 * var(--u));}
.gta-logo{display:none;}
.live-badge.side-badge{display:none;}
/* شارة «مباشر» */
.live-badge{
  display:flex;align-items:center;gap:calc(1.5 * var(--u));
  background:rgba(162,148,117,0.18);border:1.5px solid var(--gold);
  border-radius:calc(6 * var(--u));padding:calc(1.2 * var(--u)) 2vw;
}
.live-badge .live-dot{
  width:calc(1.3 * var(--u));height:calc(1.3 * var(--u));border-radius:2px;background:#1ea952;
  transform:rotate(45deg);
  box-shadow:0 0 0 0 rgba(30,169,82,.7);animation:pulse 1.8s infinite;
}
.live-badge .live-txt{font-size:calc(2.1 * var(--u));font-weight:900;color:var(--gold-light);}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(30,169,82,.6);}
  70%{box-shadow:0 0 0 calc(1.5 * var(--u)) rgba(30,169,82,0);}
  100%{box-shadow:0 0 0 0 rgba(30,169,82,0);}
}

/* ============ المحتوى ============ */
.main{
  flex:1;
  display:grid;
  grid-template-columns:1.32fr 1.9fr;   /* العناوين يمين (أوسع قليلاً) · الخبر الكبير يسار */
  gap:1.6vw;grid-gap:1.6vw;
  padding:calc(2.2 * var(--u)) 2.4vw;
  min-height:0;
}

/* الخبر الرئيسي (يتدور تلقائياً) */
.feature{
  background:#fff;color:#1a1a1a;
  border-radius:calc(1.4 * var(--u));
  padding:calc(3.4 * var(--u)) 3vw;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  box-shadow:0 calc(2 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,0.35);
}
.feature .meta{display:flex;align-items:center;gap:1vw;margin-bottom:calc(2.2 * var(--u));flex-wrap:wrap;}
.cat-badge{
  font-size:calc(2.1 * var(--u));font-weight:700;padding:calc(0.8 * var(--u)) 1.5vw;border-radius:calc(3 * var(--u));color:#fff;
}
.c-qa{background:var(--crimson-dark);}
.c-eg{background:var(--navy);}
.c-ae{background:var(--teal);}
.c-sa{background:var(--gold-dark);}
.c-other{background:#555;}
.source-name{font-size:calc(2.3 * var(--u));font-weight:700;color:var(--gold-dark);}
.counter{font-size:calc(2.1 * var(--u));color:#888;margin-right:auto;}
.feature h2{
  font-size:calc(4.6 * var(--u));font-weight:900;line-height:1.3;color:#111;
  margin-bottom:calc(2.4 * var(--u));
}
.feature .excerpt{
  font-size:calc(3 * var(--u));line-height:1.7;color:#444;font-weight:400;
  flex:1;min-height:0;overflow:hidden;
}
.feature .foot{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:calc(2 * var(--u)) 2vw;
  margin-top:calc(2 * var(--u));padding-top:calc(2 * var(--u));border-top:2px solid #eee;
}
.feature .foot .lang-tag{font-size:calc(2 * var(--u));font-weight:700;color:#999;letter-spacing:0.15vw;white-space:nowrap;}
.progress{height:calc(0.6 * var(--u));background:#eee;border-radius:calc(1 * var(--u));overflow:hidden;width:14vw;}
.progress span{display:block;height:100%;background:var(--crimson);width:0;}
/* QR */
.qr-wrap{display:flex;align-items:center;gap:1vw;}
.qr-box{background:#fff;padding:calc(0.8 * var(--u));border-radius:calc(1 * var(--u));width:calc(13.5 * var(--u));height:calc(13.5 * var(--u));
  border:1px solid #eee;flex-shrink:0;}
.qr-box img,.qr-box canvas{width:100%!important;height:100%!important;display:block;}
.qr-cap{font-size:calc(2.3 * var(--u));font-weight:700;color:var(--gold-dark);line-height:1.4;max-width:14vw;}
.foot-right{display:flex;flex-direction:column;align-items:flex-end;gap:calc(1.2 * var(--u));flex-shrink:0;}

/* قائمة الأخبار الجانبية */
.sidelist{display:flex;flex-direction:column;min-height:0;}
.side-head{
  display:flex;align-items:center;gap:0.8vw;
  font-size:calc(2.5 * var(--u));font-weight:900;color:var(--gold-light);
  margin-bottom:calc(1.4 * var(--u));padding-bottom:calc(1.2 * var(--u));
  border-bottom:2px solid rgba(162,148,117,0.4);
}
.side-head .globe{width:calc(2.9 * var(--u));height:calc(2.9 * var(--u));flex-shrink:0;display:block;}
.side-items{
  display:flex;flex-direction:column;gap:calc(1.1 * var(--u));flex:1;
  overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;
  padding:calc(0.6 * var(--u)) calc(2 * var(--u)) calc(0.6 * var(--u)) calc(1.8 * var(--u));   /* مساحة يمين لطرف البطاقة المكبّرة + يسار للسهم */
}
.side-items{scrollbar-width:none;}
.side-items::-webkit-scrollbar{display:none;}
/* الحاوية: الشريط المؤشر + العناوين */
.side-body{display:flex;gap:1vw;flex:1;min-height:0;}
.rail{position:relative;width:calc(0.5 * var(--u));background:rgba(255,255,255,0.12);
  border-radius:calc(1 * var(--u));flex-shrink:0;margin:calc(1.2 * var(--u)) 0;}
.rail-dot{position:absolute;left:50%;top:0;transform:translate(-50%,-50%) rotate(45deg);
  width:calc(1.7 * var(--u));height:calc(1.7 * var(--u));background:var(--gold);border-radius:2px;
  box-shadow:0 calc(0.3 * var(--u)) calc(0.9 * var(--u)) rgba(0,0,0,0.35);
  transition:top .6s cubic-bezier(.22,.61,.36,1);}
.side-item{
  display:flex;align-items:flex-start;gap:0.8vw;
  /* زجاجية */
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(9px) saturate(140%);
  -webkit-backdrop-filter:blur(9px) saturate(140%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:calc(1.5 * var(--u));
  padding:calc(1.5 * var(--u)) 1.3vw;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.10), 0 6px 18px rgba(0,0,0,0.18);
  transition:transform .4s cubic-bezier(.22,.61,.36,1), background .4s ease, box-shadow .4s ease, border-color .4s ease;
  animation:itemIn .5s cubic-bezier(.22,.61,.36,1) both;
}
/* العلامة بجانب كل عنوان (بدل الأقواس) */
.side-item .si-mark{color:var(--gold-light);font-size:calc(1.5 * var(--u));line-height:1.7;flex-shrink:0;}
.side-item .si-body{flex:1;min-width:0;}
.side-item .si-src{font-size:calc(2 * var(--u));font-weight:700;color:var(--gold-light);margin-bottom:calc(0.6 * var(--u));}
.side-item .si-src{display:flex;align-items:center;gap:0.5vw;direction:rtl;}
.side-item .si-src .flag{margin-left:0;}
.side-item .si-src .si-np{unicode-bidi:isolate;}
.side-item .si-title{font-size:calc(2.5 * var(--u));font-weight:700;line-height:1.45;color:#fff;}
/* الخبر المعروض الآن — بطاقة ذهبية + سهم يشير للمقال */
.side-item.on{
  position:relative;
  background:linear-gradient(90deg,var(--gold-light) 0%,var(--gold) 100%);
  transform:scale(1.04);
  box-shadow:0 calc(1.2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,0.35), 0 0 calc(2.6 * var(--u)) rgba(196,184,154,0.4);
}
/* سهم بنهاية المستطيل يشير للمقال (يسار) — بلون طرف البطاقة نفسه */
.side-item.on::after{
  content:'';position:absolute;top:50%;left:calc(-1 * var(--u));transform:translateY(-50%);
  border-top:calc(1 * var(--u)) solid transparent;border-bottom:calc(1 * var(--u)) solid transparent;
  border-right:calc(1.1 * var(--u)) solid var(--gold-light);
}
.side-item.on .si-mark{color:var(--crimson-dark);}
.side-item.on .si-src{color:var(--crimson-dark);}
.side-item.on .si-title{color:#2a1206;}
/* أعلام الدول — مستطيل كامل بعرض ثابت (بدون قص · يستوعب نِسَب مختلفة مثل قطر) */
.flag{width:calc(3 * var(--u));height:auto;border-radius:3px;vertical-align:middle;
  margin-left:0.5vw;box-shadow:0 0 0 1px rgba(255,255,255,0.3);}
.cat-badge .flag{width:calc(3.6 * var(--u));margin-left:0.6vw;box-shadow:0 0 0 1px rgba(255,255,255,0.55);}

/* احتياط للمتصفحات القديمة التي لا تدعم gap داخل flex: يضيف الكشف الصنف no-gap */
.no-gap .brand-wrap>*+*{margin-right:calc(2.4 * var(--u));}
.no-gap .live-badge>*+*{margin-right:calc(1.5 * var(--u));}
.no-gap .feature .meta>*{margin-left:1vw;}
.no-gap .qr-wrap>*+*{margin-right:1vw;}
.no-gap .foot-right>*+*{margin-top:calc(1.2 * var(--u));}
.no-gap .side-head .globe{margin-left:0.8vw;}
.no-gap .side-head .live-badge{margin-right:auto;}
.no-gap .side-body>*+*{margin-right:1vw;}
.no-gap .side-items>*+*{margin-top:calc(1.1 * var(--u));}
.no-gap .si-src>*+*{margin-right:0.5vw;}
@media (orientation:portrait){
  .no-gap .brand-wrap>*+*{margin-right:0;margin-top:calc(3 * var(--u));}
  .no-gap .side-head .globe{margin-left:calc(1.3 * var(--u));}
  .no-gap .side-items>*+*{margin-top:calc(1.2 * var(--u));}
}

/* أنيميشن */
@keyframes itemIn{from{opacity:0;translate:0 calc(1.3 * var(--u));}to{opacity:1;translate:0 0;}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(calc(1.8 * var(--u)));}to{opacity:1;transform:translateY(0);}}
.reveal{animation:fadeSlideUp .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:var(--d,0s);}

/* ============ شاشة طولية (1080×1920) ============ */
@media (orientation:portrait){
  :root{--u:1vw;--g:3.2;}   /* --g = الهامش الأساسي؛ كل المسافات مضاعفاته */
  /* الهيدر: شعار ← عنوان رئيسي ← عنوان فرعي، متمركزة وبإيقاع مسافات واحد */
  .topbar{position:relative;justify-content:center;
    padding:calc(4.2 * var(--u)) calc(var(--g) * var(--u)) calc(3.8 * var(--u));}
  .brand-wrap{flex-direction:column;justify-content:center;align-items:center;gap:calc(3 * var(--u));}
  .gta-logo{display:block;height:calc(9 * var(--u));width:auto;}
  .brand-title{padding:0;align-items:center;text-align:center;}
  .brand-title h1{font-size:calc(5.8 * var(--u));line-height:1.2;letter-spacing:0;}
  .brand-sub{font-size:calc(2.5 * var(--u));margin-top:calc(1.3 * var(--u));opacity:.95;}
  .topbar .live-badge{display:none;}
  .live-badge.side-badge{display:flex;margin-right:auto;padding:calc(0.8 * var(--u)) calc(1.8 * var(--u));}
  .side-badge .live-txt{font-size:calc(2 * var(--u));font-weight:900;}
  .side-badge .live-dot{width:calc(1.4 * var(--u));height:calc(1.4 * var(--u));}
  /* المحتوى: هوامش جانبية = الهامش الأساسي، والمسافة بين الكتل = الهامش نفسه */
  .main{display:flex;flex-direction:column;gap:0;grid-gap:0;
    padding:calc(2.8 * var(--u)) calc(var(--g) * var(--u)) calc(3 * var(--u));}
  .feature{order:1;flex:1 1 0;min-height:0;padding:calc(3.2 * var(--u)) calc(3.2 * var(--u));}
  .sidelist{order:2;flex:0 0 auto;margin-top:calc(2.6 * var(--u));max-height:calc(64 * var(--u));}
  .side-body{flex:1 1 auto;}
  .side-items{flex:1 1 auto;}
  .feature h2{font-size:calc(4.2 * var(--u));margin-bottom:calc(1.8 * var(--u));}
  .qr-box{width:calc(15 * var(--u));height:calc(15 * var(--u));}
  /* قسم «أحدث العناوين» */
  .side-head{font-size:calc(3 * var(--u));gap:calc(1.3 * var(--u));
    margin-bottom:calc(1.4 * var(--u));padding-bottom:calc(1.3 * var(--u));}
  .side-head .globe{width:calc(3.2 * var(--u));height:calc(3.2 * var(--u));}
  .side-items{gap:calc(1.2 * var(--u));}
  .side-item{padding:calc(1.4 * var(--u)) calc(1.8 * var(--u));}
  .side-item .si-src{font-size:calc(2 * var(--u));margin-bottom:calc(0.4 * var(--u));}
  .side-item .si-title{font-size:calc(2.45 * var(--u));line-height:1.4;}
}
}
</style>
</head>
<body>

  <!-- ===== الهيدر ===== -->
  <header class="topbar">
    <div class="brand-wrap">
      <img class="gta-logo" src="gta-logo-white.png" alt="الهيئة العامة للضرائب">
      <div class="brand-title">
        <h1>التقرير الإعلامي اليومي</h1>
        <div class="brand-sub">رصد إعلامي يومي للأخبار المتعلقة بالضرائب</div>
      </div>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span>
      <span class="live-txt">رصد تلقائي</span>
    </div>
  </header>

  <!-- ===== المحتوى ===== -->
  <div class="main">
    <!-- القائمة الجانبية (يمين) -->
    <aside class="sidelist">
      <div class="side-head">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="#c4b89a" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="9.2"/>
          <ellipse cx="12" cy="12" rx="4" ry="9.2"/>
          <line x1="2.8" y1="12" x2="21.2" y2="12"/>
          <path d="M5 6.6 H19 M5 17.4 H19"/>
        </svg>
        أحدث العناوين
        <span class="live-badge side-badge"><span class="live-dot"></span><span class="live-txt">رصد تلقائي</span></span>
      </div>
      <div class="side-body">
        <div class="rail"><span class="rail-dot" id="railDot"></span></div>
        <div class="side-items" id="sideItems"></div>
      </div>
    </aside>

    <!-- الخبر الرئيسي (يسار) -->
    <section class="feature">
      <div class="meta">
        <span class="cat-badge c-qa" id="fCountry">—</span>
        <span class="source-name" id="fSource">—</span>
        <span class="counter" id="fCounter">—</span>
      </div>
      <h2 id="fTitle">جارٍ تحميل الأخبار…</h2>
      <p class="excerpt" id="fExcerpt"></p>
      <div class="foot">
        <div class="qr-wrap">
          <div class="qr-box" id="qrBox"></div>
          <span class="qr-cap">امسح الرمز لقراءة<br>الخبر كاملاً</span>
        </div>
        <div class="foot-right">
          <span class="lang-tag" id="fReportDate"></span>
          <div class="progress"><span id="fBar"></span></div>
        </div>
      </div>
    </section>
  </div>

<!-- مكتبة توليد QR — تعمل محلياً في المتصفح، بدون أي نداء خارجي -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// كشف دعم gap في flex (غير مدعوم في المتصفحات القديمة على بعض الشاشات)
(function(){
  try{
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
    d.appendChild(document.createElement('div')); d.appendChild(document.createElement('div'));
    document.body.appendChild(d);
    var ok = d.scrollHeight === 1;
    document.body.removeChild(d);
    if(!ok) document.documentElement.className += ' no-gap';
  }catch(e){ document.documentElement.className += ' no-gap'; }
})();
</script>
<script>
/* ==========================================================================
   مصدر البيانات — endpoint عام (بدون تسجيل دخول على الشاشة)
   --------------------------------------------------------------------------
   الشاشة تقرأ من endpoint عام يرجّع JSON بالشكل:
     { data: [ { text, country, newspaper, description, source } ], updatedAt }
   وهذا الـ endpoint (كود منفصل على السيرفر) هو اللي يقرأ قائمة SharePoint
   "DailyReportAR" عبر Microsoft Graph — انظر ملف api-signage-tax-route.ts
   بيانات الاعتماد تبقى على السيرفر فقط ولا تصل الشاشة إطلاقاً.

   غيّر FEED_URL لرابط الـ endpoint بعد نشره (مثال: /api/signage/tax أو رابط كامل).
   ========================================================================== */
// feed.json = آخر تقرير + أرشيف التقارير السابقة (يبنيه GitHub تلقائياً عند كل تحديث).
// نقرأ المصدرين معاً ونأخذ الأحدث: نسخة الموقع نفسه (تعمل دائماً على شبكة الهيئة) ونسخة GitHub المباشرة.
const FEED_SOURCES = [
  "feed.json",
  "https://raw.githubusercontent.com/rustomabd/tax-news-signage/main/feed.json"
];
const FETCH_TIMEOUT_MS = 7000;   // أي مصدر لا يرد خلال هذه المدة نتجاوزه بدل الانتظار للأبد

// عيّنة حقيقية من تقرير 15/09/2026 (احتياطية عند فتح الملف محلياً بدون جلسة)
const SAMPLE = {
  PublishDate: "2026-09-15T07:42:45Z",

let news = [];
let reportDate = "";
let idx = 0;
const MIN_NEWS = 4;   // الحد الأدنى للأخبار المعروضة (نكمّل من التقارير القديمة)
const ROTATE_MS = 12000; // مدة عرض كل خبر رئيسي

// لون شارة الدولة
function countryClass(c){
  if(!c) return 'c-other';
  if(c.indexOf('قطر') > -1) return 'c-qa';
  if(c.indexOf('مصر') > -1) return 'c-eg';
  if(c.indexOf('الإمارات') > -1 || c.indexOf('الامارات') > -1) return 'c-ae';
  if(c.indexOf('السعودية') > -1) return 'c-sa';
  return 'c-other';
}

// خريطة اسم الدولة (عربي) → الرمز الدولي ISO — تعمل لأي دولة تلقائياً
const ISO_MAP = [
  ['qa',['قطر']], ['sa',['سعود']], ['ae',['إمارات','امارات']], ['kw',['كويت']],
  ['bh',['بحرين']], ['om',['عمان','عُمان']], ['eg',['مصر']], ['jo',['أردن','اردن']],
  ['lb',['لبنان']], ['sy',['سوري']], ['iq',['عراق']], ['ps',['فلسطين']],
  ['ye',['يمن']], ['ly',['ليبيا']], ['tn',['تونس']], ['dz',['جزائر']], ['ma',['مغرب']],
  ['mr',['موريتانيا']], ['sd',['سودان']], ['so',['صومال']], ['dj',['جيبوتي']], ['km',['القمر']],
  ['tr',['تركي']], ['ir',['إيران','ايران']], ['gb',['بريطانيا','المملكة المتحدة']],
  ['us',['أمريك','امريك','الولايات المتحدة']], ['fr',['فرنسا']], ['de',['ألمانيا','المانيا']],
  ['cn',['الصين']], ['in',['الهند']], ['ru',['روسيا']], ['jp',['اليابان']], ['ca',['كندا']],
  ['au',['أستراليا','استراليا']], ['es',['إسبانيا','اسبانيا']], ['it',['إيطاليا','ايطاليا']],
  ['eu',['الأوروبي']], ['pk',['باكستان']], ['id',['إندونيسيا','اندونيسيا']], ['my',['ماليزيا']],
  ['sg',['سنغافورة']], ['kr',['كوريا']], ['br',['البرازيل']], ['ch',['سويسرا']],
  ['nl',['هولندا']], ['be',['بلجيكا']], ['se',['السويد']], ['no',['النرويج']],
  ['dk',['دنمارك']], ['gr',['اليونان']], ['pt',['البرتغال']], ['at',['النمسا']],
  ['az',['أذربيجان','اذربيجان']], ['th',['تايلاند']], ['ph',['الفلبين']], ['ng',['نيجيريا']],
];
function isoFor(c){
  if(!c) return '';
  for(var i=0;i<ISO_MAP.length;i++){ var keys=ISO_MAP[i][1]; for(var q=0;q<keys.length;q++){ if(c.indexOf(keys[q]) > -1) return ISO_MAP[i][0]; } }
  return '';
}
function flagImg(country){
  const iso = isoFor(country);
  if(!iso) return '';
  return '<img class="flag" src="https://flagcdn.com/w40/'+iso+'.png" alt="">';
}

// فكّ رابط Outlook SafeLink للحصول على رابط المقال المباشر
function unwrapSafe(u){
  if(!u) return '';
  try{
    if(u.indexOf('safelinks.protection.outlook.com') > -1){
      const real = new URL(u).searchParams.get('url');
      if(real) return decodeURIComponent(real);
    }
  }catch(e){}
  return u;
}

// توليد رمز QR لرابط الخبر (محلياً بالكامل)
function renderQR(url){
  const box = document.getElementById('qrBox');
  box.innerHTML = '';
  const target = url || 'https://www.gta.gov.qa';
  if(window.QRCode){
    new QRCode(box, { text: target, width:260, height:260,
      colorDark:'#111', colorLight:'#fff', correctLevel: QRCode.CorrectLevel.M });
  }
}

// توحيد شكل الخبر داخلياً: {title, country, newspaper, desc, source}
function normalize(a){
  return {
    title:     a.title     || a.text     || a.TitleAR   || '',
    country:   a.country   || a.CountryAR  || '',
    newspaper: a.newspaper || a.NewPaperAR || '',
    desc:      a.desc      || a.description|| a.DescAR    || '',
    source:    a.source    || a.Source     || '',
  };
}

function getJSON(url, timeoutMs){
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + Math.floor(new Date().getTime()/120000), true);
    x.timeout = timeoutMs;
    x.onload = function(){
      if(x.status >= 200 && x.status < 300){
        try{ resolve(JSON.parse(x.responseText)); }catch(e){ reject(e); }
      } else { reject(new Error('HTTP ' + x.status)); }
    };
    x.onerror   = function(){ reject(new Error('network')); };
    x.ontimeout = function(){ reject(new Error('timeout')); };
    x.send();
  });
}

function withDate(n, d){
  return { title:n.title, country:n.country, newspaper:n.newspaper, desc:n.desc, source:n.source, date:d };
}

// نبني قائمة الأخبار: أخبار آخر تقرير، ثم نكمّل من الأرشيف حتى الحد الأدنى
function buildNews(j){
  reportDate = j.updatedAt || new Date().toISOString();
  var out = [], seen = {}, k, a, n, h, hd;
  for(k = 0; k < j.data.length; k++){
    n = normalize(j.data[k]);
    if(!n.title || seen[n.title]) continue;
    seen[n.title] = true; out.push(withDate(n, reportDate));
  }
  var hist = j.history || [];
  for(h = 0; h < hist.length && out.length < MIN_NEWS; h++){
    hd = hist[h].date || hist[h].PublishDate || '';
    var arr = hist[h].data || [];
    for(a = 0; a < arr.length && out.length < MIN_NEWS; a++){
      n = normalize(arr[a]);
      if(!n.title || seen[n.title]) continue;
      seen[n.title] = true; out.push(withDate(n, hd));
    }
  }
  return out;
}

function feedStamp(f){ return (f && f.updatedAt) ? String(f.updatedAt) : ''; }

/* دالة التحميل — تقرأ المصادر معاً (بمهلة)، وتأخذ الأحدث؛ وإلا آخر نسخة محفوظة؛ وإلا العيّنة */
function loadNews(){
  var tasks = FEED_SOURCES.map(function(u){
    return getJSON(u, FETCH_TIMEOUT_MS).then(function(x){
      return (x && x.data && x.data.length) ? x : null;
    }).catch(function(e){ console.log('تعذّر المصدر', u, e.message); return null; });
  });
  return Promise.all(tasks).then(function(res){
    var best = null, i;
    for(i = 0; i < res.length; i++){
      if(res[i] && (!best || feedStamp(res[i]) > feedStamp(best))) best = res[i];
    }
    if(best){
      try{ localStorage.setItem('rasd_last_feed', JSON.stringify(best)); }catch(e){}
      return best;
    }
    try{                                   // لا اتصال: آخر نسخة ناجحة محفوظة على الشاشة
      var c = JSON.parse(localStorage.getItem('rasd_last_feed') || 'null');
      if(c && c.data && c.data.length) return c;
    }catch(e){}
    return null;
  }).then(function(feed){
    if(feed){ news = buildNews(feed); }
    else {
      news = SAMPLE.Details.map(normalize).map(function(n){ return withDate(n, SAMPLE.PublishDate); });
      reportDate = SAMPLE.PublishDate;
    }
    if(idx >= news.length) idx = 0;
  });
}

function fmtDate(iso){
  const d = new Date(iso);
  function p2(v){ return (v < 10 ? '0' : '') + v; }
  return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
}

// خط المقال المتكيّف: أكبر حجم يناسب المساحة المتاحة (خبر قصير = خط أكبر)
function fitExcerpt(){
  const el = document.getElementById('fExcerpt');
  const portrait = matchMedia('(orientation:portrait)').matches;
  let lo = portrait ? 2.4 : 2.6, hi = 4.4;
  const px = v => 'calc(' + v + ' * var(--u))';
  // إعادة الضبط (إلغاء أي اقتطاع سابق)
  el.style.display = ''; el.style.webkitLineClamp = ''; el.style.webkitBoxOrient = ''; el.style.maxHeight = '';
  el.style.fontSize = px(lo);
  if (el.scrollHeight <= el.clientHeight + 1) {
    for (let i = 0; i < 8; i++) {
      const mid = (lo + hi) / 2;
      el.style.fontSize = px(mid);
      if (el.scrollHeight > el.clientHeight + 1) hi = mid; else lo = mid;
    }
    el.style.fontSize = px(lo);
    return;
  }
  // حتى الأصغر لا يتسع: نقتطع عند آخر سطر كامل مع «…» بدل قصّ نصف سطر
  const lh = parseFloat(getComputedStyle(el).lineHeight);
  const lines = Math.max(1, Math.floor(el.clientHeight / lh));
  el.style.setProperty('display', '-webkit-box');
  el.style.setProperty('-webkit-box-orient', 'vertical');
  el.style.setProperty('-webkit-line-clamp', String(lines));
  el.style.maxHeight = (lines * lh) + 'px';   // ضمان: لا يظهر أي جزء من سطر مقطوع
}
window.addEventListener('resize', fitExcerpt);
// أعد الحساب بعد اكتمال تحميل خط Lusail (قبلها تكون القياسات غير دقيقة)
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitExcerpt);

function renderFeature(){
  const n = news[idx];
  const badge = document.getElementById('fCountry');
  badge.innerHTML = flagImg(n.country) + (n.country || '—');
  badge.className = 'cat-badge ' + countryClass(n.country);
  document.getElementById('fSource').textContent = "المصدر: " + (n.newspaper || '');
  document.getElementById('fCounter').textContent = "خبر " + (idx+1) + " من " + news.length;
  document.getElementById('fTitle').textContent = n.title || '';
  document.getElementById('fExcerpt').textContent = n.desc || '';
  fitExcerpt();
  document.getElementById('fReportDate').textContent = fmtDate(n.date || reportDate);
  renderQR(unwrapSafe(n.source));

  // ظهور ناعم متدرّج لعناصر الخبر عند كل تدوير
  [document.querySelector('.meta'), document.getElementById('fTitle'), document.getElementById('fExcerpt')]
    .forEach((el,i)=>{
      el.classList.remove('reveal'); void el.offsetWidth;
      el.style.setProperty('--d', (i*0.09)+'s');
      el.classList.add('reveal');
    });

  const bar = document.getElementById('fBar');
  bar.style.transition = 'none';
  bar.style.width = '0';
  requestAnimationFrame(()=>{
    bar.style.transition = 'width ' + ROTATE_MS + 'ms linear';
    bar.style.width = '100%';
  });

  document.querySelectorAll('.side-item').forEach((el,i)=>{
    el.classList.toggle('on', i === idx);
  });
  // سكرول تلقائي ناعم يتبع الخبر المعروض
  const act = document.querySelector('.side-item.on');
  if(act) act.scrollIntoView({behavior:'smooth', block:'nearest'});
  // المعيّن يتوسّط مركز الخبر المعروض تماماً
  const dot = document.getElementById('railDot');
  const rail = document.querySelector('.rail');
  if(dot && rail && act){
    const place = ()=>{
      const rr = rail.getBoundingClientRect();
      const ar = act.getBoundingClientRect();
      dot.style.top = (ar.top + ar.height/2 - rr.top) + 'px';
    };
    place();
    setTimeout(place, 450);   // إعادة الضبط بعد استقرار السكرول
  }
}

function renderSide(){
  const box = document.getElementById('sideItems');
  box.innerHTML = '';
  news.forEach((n,i)=>{
    const d = document.createElement('div');
    d.className = 'side-item' + (i===idx?' on':'');
    d.style.animationDelay = (i*0.06)+'s';   // دخول متدرّج
    d.innerHTML = '<div class="si-body">'
                +   '<div class="si-src">'+flagImg(n.country)+'<bdi class="si-np">'+(n.newspaper||'')+'</bdi><span class="si-sep">·</span><bdi>'+(n.country||'')+'</bdi></div>'
                +   '<div class="si-title">'+(n.title||'')+'</div>'
                + '</div>';
    box.appendChild(d);
  });
}

function nextFeature(){
  idx = (idx + 1) % news.length;
  renderFeature();
}

function init(){
  loadNews().then(function(){
    renderSide();
    renderFeature();
    window.__ready = true;
    setInterval(nextFeature, ROTATE_MS);
    // إعادة سحب أحدث تقرير كل 15 دقيقة
    setInterval(function(){ loadNews().then(renderSide); }, 15 * 60 * 1000);
  });
}
// حارس: لو بقيت الصفحة على «جارٍ التحميل» لأي سبب، نعيد تحميلها تلقائياً
setTimeout(function(){ if(!window.__ready) location.reload(); }, 30000);
init();
</script>
